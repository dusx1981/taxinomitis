<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Download TensorFlow.js Model</title>
</head>
<body>
  <button id="downloadBtn">下载 image-recognition</button>

  <script>
    async function downloadModel() {
      // 用户选择一个文件夹
      const dirHandle = await window.showDirectoryPicker();

      const files = [
        { 
          url: "https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_0.25_224/model.json", 
          file: "model.json" 
        }
      ];

      for (let x = 1; x <= 55; x++) {
        const filename = "group" + x + "-shard1of1";
        files.push({
          url: "https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_0.25_224/" + filename,
          file: filename
        });
      }

      for (const f of files) {
        console.log("下载中:", f.url);
        const response = await fetch(f.url);
        if (!response.ok) throw new Error("下载失败：" + f.url);
        const blob = await response.blob();

        // 在文件夹中创建/写入文件
        const fileHandle = await dirHandle.getFileHandle(f.file, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
      }

      alert("全部文件保存完成！");
    }

    document.getElementById("downloadBtn").addEventListener("click", downloadModel);
  </script>
</body>
</html>
