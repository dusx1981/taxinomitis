<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>图片下载器 - 有机/非有机垃圾图片</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 30px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .file-input-container {
      margin-bottom: 20px;
      text-align: center;
    }
    .file-label {
      display: inline-block;
      background-color: #3498db;
      color: white;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s;
    }
    .file-label:hover {
      background-color: #2980b9;
    }
    #jsonFile {
      display: none;
    }
    .file-name {
      margin-top: 10px;
      color: #7f8c8d;
      font-style: italic;
    }
    button {
      display: block;
      width: 100%;
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 20px;
    }
    button:hover {
      background-color: #27ae60;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }
    .results {
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 15px;
      background: #fafafa;
    }
    .success { 
      color: #27ae60; 
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }
    .error { 
      color: #e74c3c; 
      padding: 5px 0;
      border-bottom: 1px solid #eee;
    }
    .progress {
      margin-top: 10px;
      width: 100%;
      background-color: #ecf0f1;
      border-radius: 5px;
      overflow: hidden;
      height: 10px;
    }
    .progress-bar {
      height: 100%;
      background-color: #3498db;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text {
      text-align: center;
      color: #7f8c8d;
      margin-top: 5px;
    }
    .summary {
      margin-top: 15px;
      padding: 10px;
      background-color: #fff3cd;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      color: #856404;
    }
    .info {
      background-color: #d1ecf1;
      border-left: 4px solid #3498db;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>🗑️ 图片下载器</h1>
  <div class="container">
    <div class="info">
      <strong>功能说明：</strong> 使用 File System Access API，可以选择保存目录，图片将按URL路径结构保存到指定文件夹中。
    </div>
    
    <div class="file-input-container">
      <label for="jsonFile" class="file-label">选择JSON文件</label>
      <input type="file" id="jsonFile" accept=".json">
      <div id="fileName" class="file-name">未选择文件</div>
    </div>
    
    <button id="downloadBtn" disabled>选择保存目录并下载图片</button>
    
    <div class="progress" style="display: none;">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-text" id="progressText"></div>
    
    <div class="results" id="results"></div>
  </div>

  <script>
    let jsonData = null;
    let saveDirectoryHandle = null;
    
    const jsonFileInput = document.getElementById("jsonFile");
    const fileNameDisplay = document.getElementById("fileName");
    const downloadBtn = document.getElementById("downloadBtn");
    const results = document.getElementById("results");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const progressContainer = document.querySelector(".progress");

    // 检查浏览器是否支持 File System Access API
    function isFileSystemAccessAPISupported() {
      return 'showDirectoryPicker' in window;
    }

    // 从URL中提取路径和文件名
    function extractPathAndFilename(url) {
      try {
        const urlObj = new URL(url);
        const pathname = urlObj.pathname;
        
        // 分割路径并过滤空部分
        const pathParts = pathname.split('/').filter(part => part.length > 0);
        
        if (pathParts.length === 0) {
          return { path: '', filename: 'unknown.jpg' };
        }
        
        // 文件名是最后一部分
        const filename = pathParts.pop();
        
        // 剩余部分是路径
        const path = pathParts.join('/');
        
        return { path, filename };
      } catch (error) {
        console.error('URL解析错误:', error);
        // 如果URL解析失败，尝试简单分割
        const lastSlashIndex = url.lastIndexOf('/');
        if (lastSlashIndex === -1) {
          return { path: '', filename: 'unknown.jpg' };
        }
        
        const pathPart = url.substring(0, lastSlashIndex);
        const filename = url.substring(lastSlashIndex + 1);
        
        // 从pathPart中提取路径部分（去掉协议和域名）
        const pathMatch = pathPart.match(/\/\/([^\/]+)(\/.*)?$/);
        const path = pathMatch && pathMatch[2] ? pathMatch[2].substring(1) : '';
        
        return { path, filename: filename || 'unknown.jpg' };
      }
    }

    // 选择 JSON 文件
    jsonFileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      fileNameDisplay.textContent = `已选择: ${file.name}`;
      
      try {
        const text = await file.text();
        jsonData = JSON.parse(text);
        downloadBtn.disabled = false;
        
        // 计算各类别的图片数量
        let totalCount = 0;
        let categoryInfo = [];
        
        for (const category in jsonData.data) {
          const count = jsonData.data[category].length;
          totalCount += count;
          categoryInfo.push(`${category}: ${count} 张`);
        }
        
        results.innerHTML = `<p class="success">✅ 已加载 JSON 文件: ${file.name}</p>`;
        results.innerHTML += `<p>发现 ${totalCount} 张图片 (${categoryInfo.join(', ')})</p>`;
        
        // 显示metadata信息（如果有）
        if (jsonData.metadata && jsonData.metadata.name) {
          results.innerHTML += `<p><strong>数据集:</strong> ${jsonData.metadata.name}</p>`;
        }
        
        // 检查浏览器支持情况
        if (!isFileSystemAccessAPISupported()) {
          results.innerHTML += `<div class="error">⚠️ 您的浏览器不支持 File System Access API，将使用传统下载方式</div>`;
        }
      } catch (err) {
        alert("JSON 格式错误！请选择有效的JSON文件。");
        console.error(err);
        downloadBtn.disabled = true;
        fileNameDisplay.textContent = "文件格式错误，请重新选择";
      }
    });

    // 下载图片
    downloadBtn.addEventListener("click", async () => {
      if (!jsonData) {
        alert("请先选择 JSON 文件");
        return;
      }

      // 禁用按钮，防止重复点击
      downloadBtn.disabled = true;
      progressContainer.style.display = "block";
      progressBar.style.width = "0%";
      progressText.textContent = "准备下载...";
      
      try {
        // 如果支持 File System Access API，让用户选择保存目录
        if (isFileSystemAccessAPISupported()) {
          try {
            saveDirectoryHandle = await window.showDirectoryPicker();
            results.innerHTML += `<p class="success">✅ 已选择保存目录</p>`;
          } catch (err) {
            if (err.name !== 'AbortError') {
              console.error("目录选择错误:", err);
              results.innerHTML += `<div class="error">❌ 目录选择失败: ${err.message}</div>`;
            }
            downloadBtn.disabled = false;
            return;
          }
        } else {
          results.innerHTML += `<div class="error">⚠️ 浏览器不支持目录选择，将使用传统下载方式</div>`;
        }
        
        // 收集所有图片URL
        const allUrls = [];
        for (const category in jsonData.data) {
          jsonData.data[category].forEach(url => {
            allUrls.push({ url, category });
          });
        }
        
        results.innerHTML += `<p>开始下载 ${allUrls.length} 张图片...</p>`;
        
        let success = 0, fail = 0;
        const total = allUrls.length;
        
        // 逐个下载图片
        for (let i = 0; i < allUrls.length; i++) {
          const item = allUrls[i];
          
          try {
            // 更新进度
            const progress = Math.round((i / total) * 100);
            progressBar.style.width = `${progress}%`;
            progressText.textContent = `下载中... ${i+1}/${total}`;
            
            // 获取图片数据
            const response = await fetch(item.url);
            if (!response.ok) throw new Error("网络错误 " + response.status);
            
            const blob = await response.blob();
            
            // 提取路径和文件名
            const { path, filename } = extractPathAndFilename(item.url);
            let finalFilename = filename;
            
            // 如果没有文件扩展名，根据内容类型添加
            if (!finalFilename.includes('.')) {
              const extension = blob.type.split('/')[1] || 'jpg';
              finalFilename = `${finalFilename}.${extension}`;
            }
            
            // 使用 File System Access API 保存文件
            if (saveDirectoryHandle) {
              try {
                let currentDirHandle = saveDirectoryHandle;
                
                // 如果URL有路径，创建对应的目录结构
                if (path) {
                  const pathSegments = path.split('/').filter(segment => segment.length > 0);
                  
                  for (const segment of pathSegments) {
                    // 安全过滤目录名（移除非法字符）
                    const safeSegment = segment.replace(/[<>:"|?*]/g, '_');
                    currentDirHandle = await currentDirHandle.getDirectoryHandle(safeSegment, { create: true });
                  }
                }
                
                // 创建类别子文件夹（在URL路径内部）
                // const categoryDirHandle = await currentDirHandle.getDirectoryHandle(item.category, { create: true });
                
                // 创建文件
                const fileHandle = await currentDirHandle.getFileHandle(finalFilename, { create: true });
                const writable = await fileHandle.createWritable();
                await writable.write(blob);
                await writable.close();
                
                success++;
                const displayPath = path ? `${path}/` : '';
                results.innerHTML += `<div class="success">✅ 图片保存: ${displayPath}${finalFilename}</div>`;
              } catch (err) {
                console.error("文件保存错误:", err);
                throw new Error(`文件保存失败: ${err.message}`);
              }
            } else {
              // 回退到传统下载方式
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              
              // 传统下载方式不能创建目录，所以将路径转换为文件名的一部分
              const pathPrefix = path ? path.replace(/\//g, '_') + '_' : '';
              a.download = `${item.category}_${pathPrefix}${finalFilename}`;
              
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              
              // 释放URL对象
              setTimeout(() => URL.revokeObjectURL(a.href), 100);
              
              success++;
              results.innerHTML += `<div class="success">✅ ${item.category} 图片下载: ${finalFilename}</div>`;
            }
            
            // 添加小延迟避免浏览器过载
            await new Promise(resolve => setTimeout(resolve, 100));
            
          } catch (err) {
            fail++;
            results.innerHTML += `<div class="error">❌ 图片下载失败: ${item.url} (${err.message})</div>`;
            console.error("下载失败:", err);
          }
          
          // 滚动到底部
          results.scrollTop = results.scrollHeight;
        }
        
        // 完成进度
        progressBar.style.width = "100%";
        progressText.textContent = "下载完成!";
        
        // 显示总结
        const summary = document.createElement('div');
        summary.className = 'summary';
        if (fail === 0) {
          summary.innerHTML = `<p>✅ 所有 ${total} 张图片${saveDirectoryHandle ? '保存' : '下载'}成功！</p>`;
          if (saveDirectoryHandle) {
            summary.innerHTML += `<p>图片已按URL路径结构保存到您选择的文件夹中</p>`;
          }
        } else {
          summary.innerHTML = `<p>${saveDirectoryHandle ? '保存' : '下载'}完成: ${success} 成功, ${fail} 失败</p>`;
        }
        results.appendChild(summary);
        
      } catch (err) {
        console.error(err);
        results.innerHTML += `<div class="error">❌ 下载过程出错: ${err.message}</div>`;
      } finally {
        // 重新启用按钮
        downloadBtn.disabled = false;
      }
    });

    // 页面加载时检查浏览器支持
    window.addEventListener('load', () => {
      if (!isFileSystemAccessAPISupported()) {
        downloadBtn.textContent = "下载图片";
        results.innerHTML = `<div class="info">您的浏览器不支持 File System Access API，将使用传统下载方式（图片会下载到浏览器默认下载目录）</div>`;
      }
    });
  </script>
</body>
</html>
